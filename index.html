<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vitória em Sorocaba</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: um console único. Tela do jogo em 3:2 no centro, HUD em cima, controles de toque embaixo. Visual noturno fixo (tema único). */
:root{
  --bg:#1d1426;
  --panel:#2c1f39;
  --edge:#43305a;
  --ink:#f7eedb;
  --muted:#bba9cc;
  --ipe:#f5c518;
  --acai:#6b2d6b;
  --rose:#ff7a9c;
  --font:"Pixelify Sans", ui-monospace, "Cascadia Mono", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:12px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  overflow-x:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.hud{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.hud .place{color:var(--ipe);font-weight:700;font-size:17px}
.hud .obj{color:var(--ink)}
.hud .right{display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.mute{font:inherit;font-size:14px;color:var(--muted);background:var(--panel);border:2px solid var(--edge);border-radius:6px;padding:2px 8px;cursor:pointer}
.mute:focus-visible,.pad:focus-visible,.round:focus-visible,.start:focus-visible,.choice:focus-visible{outline:2px solid var(--ipe);outline-offset:2px}
.screen{position:relative;width:100%;max-width:720px;aspect-ratio:3/2;background:#000;border:4px solid var(--edge);border-radius:8px;overflow:hidden;box-shadow:0 0 0 4px var(--panel)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.dialog{position:absolute;left:3%;right:3%;bottom:4%;background:rgba(29,20,38,.95);border:3px solid var(--ink);border-radius:6px;padding:8px 14px 10px;font-size:clamp(14px,2.7vw,20px);line-height:1.35;min-height:26%;cursor:pointer}
.dialog .who{color:var(--ipe);font-weight:700;font-size:.9em;letter-spacing:.03em}
.dialog .next{position:absolute;right:10px;bottom:4px;color:var(--ipe);animation:blink 1s steps(2) infinite}
.choices{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.choice{font:inherit;color:var(--ink);background:transparent;border:0;text-align:left;padding:2px 4px;cursor:pointer;border-radius:4px}
.choice.sel{color:var(--ipe);background:rgba(245,197,24,.08)}
.choice.sel::before{content:"▶ "}
.banner{position:absolute;top:5%;left:50%;transform:translateX(-50%);background:rgba(29,20,38,.92);border:2px solid var(--ipe);color:var(--ipe);padding:3px 12px;border-radius:4px;font-size:clamp(13px,2.4vw,18px);font-weight:700;white-space:nowrap;transition:opacity .6s}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;background:rgba(29,20,38,.55)}
.overlay h1{margin:0;font-size:clamp(38px,10vw,84px);line-height:1;color:var(--ipe);text-shadow:4px 4px 0 var(--acai);letter-spacing:.02em}
.overlay p{margin:0;font-size:clamp(14px,2.8vw,20px)}
.overlay .small{font-size:clamp(12px,2.2vw,15px);color:var(--muted)}
.start{font:inherit;font-weight:700;font-size:clamp(15px,3vw,20px);color:var(--bg);background:var(--ipe);border:0;border-radius:6px;padding:8px 18px;cursor:pointer;box-shadow:0 4px 0 #a07c00;animation:pulse 1.6s ease-in-out infinite}
#end{background:rgba(29,20,38,.82);opacity:0;transition:opacity 1.2s}
#end.show{opacity:1}
#end .big{font-size:clamp(28px,7vw,56px);color:var(--rose);font-weight:700;text-shadow:3px 3px 0 var(--acai)}
.controls{display:none;width:100%;max-width:720px;justify-content:space-between;align-items:center;padding:4px 4px 8px}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:3px}
.pad{background:var(--panel);border:2px solid var(--edge);color:var(--ink);border-radius:10px;font:inherit;font-size:22px;touch-action:none}
.pad:active,.round:active{filter:brightness(1.4)}
.ab{display:flex;gap:16px;align-items:center}
.round{width:70px;height:70px;border-radius:50%;font:inherit;font-weight:700;font-size:24px;border:0;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.round small{font-size:11px;font-weight:400}
.round.a{background:var(--rose);color:var(--bg);box-shadow:0 4px 0 #b84d6a;transform:translateY(-14px)}
.round.b{background:var(--ipe);color:var(--bg);box-shadow:0 4px 0 #a07c00}
.hint{max-width:720px;width:100%;font-size:14px;color:var(--muted);text-align:center}
.hint kbd{font-family:var(--font);background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:0 5px;color:var(--ink)}
@media (pointer:coarse){.controls{display:flex}.hint{display:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.start,.dialog .next{animation:none}}
</style>

</head>
<body>
<div class="hud">
  <div><span class="place" id="place">Sorocaba</span> · <span class="obj" id="obj">Aperte começar</span></div>
  <div class="right"><span id="counts">Flores 0/5 · Gatos 0/3</span><button class="mute" id="mute" type="button">Som: ligado</button></div>
</div>

<div class="screen" id="screen">
  <canvas id="game" width="240" height="160"></canvas>
  <div class="banner" id="banner" hidden></div>
  <div class="dialog" id="dialog" hidden>
    <div class="who" id="dWho"></div>
    <div id="dText"></div>
    <div class="choices" id="dChoices"></div>
    <span class="next" id="dNext">▼</span>
  </div>
  <div class="overlay" id="title">
    <h1>Vitória</h1>
    <p>uma aventura em Sorocaba</p>
    <button class="start" id="startBtn" type="button">Começar</button>
    <p class="small">com som, de preferência</p>
  </div>
  <div class="overlay" id="end" hidden>
    <div class="big" id="endBig">Agora olha pra trás.</div>
    <p id="endLine">Vitória &amp; Eduardo</p>
    <p class="small" id="endStats"></p>
    <button class="start" id="againBtn" type="button">Jogar de novo</button>
  </div>
</div>

<div class="controls" id="controls">
  <div class="dpad">
    <span></span><button class="pad" data-dir="up" type="button" aria-label="Cima">▲</button><span></span>
    <button class="pad" data-dir="left" type="button" aria-label="Esquerda">◀</button><span></span><button class="pad" data-dir="right" type="button" aria-label="Direita">▶</button>
    <span></span><button class="pad" data-dir="down" type="button" aria-label="Baixo">▼</button><span></span>
  </div>
  <div class="ab">
    <button class="round b" id="btnB" type="button">B<small>oxi</small></button>
    <button class="round a" id="btnA" type="button">A<small>falar</small></button>
  </div>
</div>
<p class="hint">Andar: <kbd>setas</kbd> ou <kbd>WASD</kbd> · Falar/confirmar (A): <kbd>Z</kbd> <kbd>Espaço</kbd> <kbd>Enter</kbd> · Oxi (B): <kbd>X</kbd></p>

<script>
/* =========================================================
   CONFIGURAÇÃO — Eduardo, edite os textos aqui.
   ========================================================= */
const CONFIG = {
  nome: "Vitória",
  autor: "Eduardo",
  prologo: true,              // cena de 2024 (DMs + bloqueio). false para pular
  filme: "Godzilla Minus One",
  bilhetes: {
    acai:   "Açaí da Barra. Nosso primeiro rolê depois de tudo. Eu tava tentando parecer tranquilo. Não tava nada.",
    ipes:   "Essa rua. As árvores altas, o chão amarelo e as florzinhas caindo enquanto a gente andava. Você parou pra tirar uma foto, e eu fiquei olhando você.",
    parque: "O banco do Campolim. A gente sentou, foi beber água, se perdeu num festival de Halloween e voltou pro mesmo banco. Eu voltaria pra ele quantas vezes fosse.",
    cafe:   "Ichigo matcha latte no Kaori. Eu passei um tempão explicando a linha do tempo de Zelda e você ouviu tudo. Isso diz muito sobre você."
  },
  cartaFinal: [
    "Agora eu preciso te falar algumas coisas..."
  ],
  // depois da carta o jogo espera alguns segundos e mostra o botão. Ela aperta quando você terminar de falar.
  esperaAntesDoBotao: 4000,   // milissegundos
  avisoBotao: "(Escuta ele. Quando ele terminar de falar, aperta o botão.)",
  textoBotao: "♥  Apertar o botão",
  pergunta: "Vitória, quer namorar comigo?",
  respostas: ["Sim!", "Oxi... é claro que sim!"],
  olhaPraTras: false,         // true mostra "Agora olha pra trás." na tela final
  rodape: "Sorocaba, 2026"
};

/* ========================= base ========================= */
const TILE = 16, COLS = 15, ROWS = 10, W = 240, H = 160;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
function R(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function hash(a, b, s = 0){
  let n = (Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(s, 982451653)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
const OPP = { up:'down', down:'up', left:'right', right:'left' };

/* ========================= áudio ========================= */
let actx = null, master = null, musicGain = null, noiseBuf = null, muted = false;
function initAudio(){
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(actx.destination);
    musicGain = actx.createGain(); musicGain.gain.value = 0.35; musicGain.connect(master);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setInterval(schedule, 30);
    if (music.track) music.next = actx.currentTime + 0.08;
  } catch (e) { actx = null; }
}
function env(g, t, vol, d){
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.setValueAtTime(vol, t + Math.max(0.012, d * 0.6));
  g.gain.linearRampToValueAtTime(0.0001, t + d);
}
function note(f, t, d, type, vol, dest){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  env(g, t, vol, d); o.connect(g); g.connect(dest || master);
  o.start(t); o.stop(t + d + 0.05);
}
function noise(t, d, vol, dest){
  const s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 6000;
  env(g, t, vol, d); s.connect(f); f.connect(g); g.connect(dest || master);
  s.start(t); s.stop(t + d + 0.02);
}
const sfx = {
  ok(){ return actx && !muted; },
  blip(){ if (this.ok()) note(660, actx.currentTime, 0.025, 'square', 0.04); },
  select(){ if (this.ok()) note(988, actx.currentTime, 0.05, 'square', 0.07); },
  pickup(){ if (!this.ok()) return; const t = actx.currentTime; [784, 988, 1319].forEach((f, i) => note(f, t + i * 0.06, 0.09, 'square', 0.09)); },
  jingle(){ if (!this.ok()) return; const t = actx.currentTime; [523, 659, 784, 1047].forEach((f, i) => note(f, t + i * 0.1, i === 3 ? 0.35 : 0.12, 'square', 0.1)); },
  oxi(){ if (!this.ok()) return; const t = actx.currentTime; note(392, t, 0.08, 'square', 0.1); note(622, t + 0.09, 0.16, 'square', 0.1); },
  bump(){ if (!this.ok()) return; const t = actx.currentTime; note(140, t, 0.1, 'square', 0.12); noise(t, 0.08, 0.12); },
  door(){ if (!this.ok()) return; const t = actx.currentTime; note(330, t, 0.08, 'triangle', 0.2); note(494, t + 0.08, 0.14, 'triangle', 0.2); },
  shutter(){ if (!this.ok()) return; const t = actx.currentTime; noise(t, 0.04, 0.3); noise(t + 0.07, 0.05, 0.25); },
  glug(){ if (!this.ok()) return; const t = actx.currentTime; [300, 360, 280, 340].forEach((f, i) => note(f, t + i * 0.09, 0.07, 'sine', 0.2)); },
  screech(){
    if (!this.ok()) return; const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(1400, t); o.frequency.linearRampToValueAtTime(900, t + 0.6);
    env(g, t, 0.06, 0.65); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.7);
    noise(t, 0.6, 0.12);
  },
  roar(){
    if (!this.ok()) return; const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 700;
    o.frequency.setValueAtTime(180, t); o.frequency.linearRampToValueAtTime(240, t + 0.3); o.frequency.linearRampToValueAtTime(70, t + 1.3);
    env(g, t, 0.35, 1.4); o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 1.5);
    noise(t, 1.2, 0.08);
  },
  hit(){ if (this.ok()) note(220, actx.currentTime, 0.12, 'square', 0.12); },
  shoot(){ if (this.ok()){ const t = actx.currentTime; note(523, t, 0.05, 'square', 0.06); note(784, t + 0.05, 0.07, 'square', 0.06); } },
  pop(){ if (this.ok()) noise(actx.currentTime, 0.05, 0.15); },
  meow(){
    if (!this.ok()) return; const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 1800;
    o.frequency.setValueAtTime(620, t); o.frequency.linearRampToValueAtTime(980, t + 0.12); o.frequency.linearRampToValueAtTime(520, t + 0.42);
    env(g, t, 0.12, 0.45); o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 0.5);
  }
};

/* músicas originais em chiptune (cada token = colcheia; "." pausa, "_" sustenta, "x" chimbal) */
const NOTE = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
function freq(n){ const m = n.match(/^([A-G])(#?)(\d)$/); const s = NOTE[m[1]] + (m[2] ? 1 : 0) + (parseInt(m[3]) + 1) * 12; return 440 * Math.pow(2, (s - 69) / 12); }
const sp = s => s.trim().split(/\s+/);
const TRACKS = {
  acai: { bpm: 138, voices: [
    { type:'square', vol:0.10, seq: sp(`C5 E5 G5 E5 A5 _ G5 . F5 E5 D5 E5 C5 _ . . D5 F5 A5 F5 B5 _ A5 . G5 F5 E5 D5 E5 _ . .
      C5 E5 G5 C6 B5 _ A5 G5 A5 G5 E5 C5 D5 _ . . E5 D5 C5 D5 E5 G5 E5 D5 C5 _ _ _ . . . .`) },
    { type:'triangle', vol:0.24, seq: sp(`C3 . G3 . C3 . G3 . C3 . G3 . E3 . G3 . D3 . A3 . D3 . A3 . G2 . D3 . G2 . D3 .
      C3 . G3 . C3 . G3 . A2 . E3 . A2 . E3 . F2 . C3 . G2 . D3 . C3 . G3 . C3 _ _ .`) },
    { type:'hat', vol:0.05, seq: sp(`. . x . . . x .`) }
  ]},
  park: { bpm: 100, voices: [
    { type:'triangle', vol:0.20, seq: sp(`A4 _ C5 _ F5 _ E5 C5 D5 _ _ C5 A4 _ _ . G4 _ A4 _ C5 _ D5 C5 A4 _ _ _ . . . .
      A4 _ C5 _ F5 _ G5 A5 G5 _ F5 _ D5 _ C5 _ A#4 _ C5 _ D5 _ E5 _ F5 _ _ _ . . . .`) },
    { type:'square', vol:0.035, seq: sp(`. . . . . . . . . . . . . . . . . . . . . . . . C6 . A5 . F5 . . .`) },
    { type:'triangle', vol:0.20, seq: sp(`F2 _ C3 _ F3 _ C3 _ D2 _ A2 _ D3 _ A2 _ C3 _ G2 _ C3 _ G2 _ F2 _ C3 _ A2 _ C3 _
      F2 _ C3 _ F3 _ C3 _ A#2 _ F2 _ A#2 _ F2 _ C3 _ G2 _ C3 _ E3 _ F2 _ _ _ C3 _ F2 _`) }
  ]},
  cafe: { bpm: 84, voices: [
    { type:'square', vol:0.07, seq: sp(`E5 . G5 . A5 _ _ G5 E5 _ D5 _ C5 _ . . D5 . E5 . G5 _ _ E5 D5 _ _ _ . . . .
      E5 . G5 . A5 _ C6 _ B5 _ A5 _ G5 _ E5 _ F5 _ E5 _ D5 _ C5 _ C5 _ _ _ . . . .`) },
    { type:'triangle', vol:0.24, seq: sp(`C3 . . C3 G2 . . . A2 . . A2 E2 . . . D3 . . D3 A2 . . . G2 . . G2 D3 . . .
      C3 . . C3 G2 . . . E3 . . E3 B2 . . . F2 . . F2 C3 . . . G2 . . G2 C3 _ _ .`) },
    { type:'hat', vol:0.035, seq: sp(`. . . . x . . .`) }
  ]},
  cinema: { bpm: 76, voices: [
    { type:'triangle', vol:0.18, seq: sp(`C5 _ _ _ E5 _ _ _ G5 _ _ _ E5 _ _ _ A4 _ _ _ C5 _ _ _ E5 _ _ _ D5 _ _ _`) },
    { type:'triangle', vol:0.18, seq: sp(`C3 _ _ _ _ _ _ _ C3 _ _ _ _ _ _ _ A2 _ _ _ _ _ _ _ G2 _ _ _ _ _ _ _`) }
  ]},
  boss: { bpm: 164, voices: [
    { type:'square', vol:0.09, seq: sp(`A4 . C5 . E5 . A5 . G5 . E5 . C5 . D5 . E5 _ _ . D5 . C5 . B4 . G4 . A4 _ _ .
      A4 . C5 . E5 . A5 . B5 . A5 . G5 . E5 . F5 _ E5 . D5 . E5 . G#5 _ _ . A5 _ _ .`) },
    { type:'triangle', vol:0.26, seq: sp(`A2 A2 . A2 A2 . A2 . F2 F2 . F2 F2 . F2 . G2 G2 . G2 G2 . G2 . E2 E2 . E2 E2 . E2 .`) },
    { type:'hat', vol:0.05, seq: sp(`x . x x x . x x`) }
  ]},
  love: { bpm: 120, voices: [
    { type:'square', vol:0.09, seq: sp(`G4 C5 E5 G5 _ E5 G5 _ A5 _ G5 E5 C5 _ D5 _ E5 _ _ D5 C5 _ A4 _ G4 _ _ _ . . . .
      G4 C5 E5 G5 _ E5 G5 _ C6 _ B5 A5 G5 _ E5 _ F5 _ E5 _ D5 _ G5 _ C5 _ _ _ . . . .`) },
    { type:'triangle', vol:0.24, seq: sp(`C3 . G3 . C3 . G3 . A2 . E3 . A2 . E3 . F2 . C3 . F2 . C3 . G2 . D3 . G2 . D3 .
      C3 . G3 . C3 . G3 . A2 . E3 . A2 . E3 . F2 . C3 . G2 . D3 . C3 . G3 . C3 _ _ .`) },
    { type:'hat', vol:0.05, seq: sp(`x . x . x . x .`) }
  ]}
};
const music = { track: null, name: null, step: 0, next: 0 };
function playMusic(name){
  if (music.name === name) return;
  music.name = name; music.track = name ? TRACKS[name] : null; music.step = 0;
  if (actx) music.next = actx.currentTime + 0.08;
}
function schedule(){
  if (!actx || !music.track) return;
  const tr = music.track, sd = 60 / tr.bpm / 2;
  if (music.next < actx.currentTime) music.next = actx.currentTime + 0.02;
  while (music.next < actx.currentTime + 0.15){
    for (const v of tr.voices){
      const n = v.seq.length, tok = v.seq[music.step % n];
      if (tok === 'x') noise(music.next, 0.04, v.vol, musicGain);
      else if (tok !== '.' && tok !== '_'){
        let len = 1; while (len < 16 && v.seq[(music.step + len) % n] === '_') len++;
        note(freq(tok), music.next, sd * len * 0.92, v.type, v.vol, musicGain);
      }
    }
    music.next += sd; music.step++;
  }
}

/* ========================= estado ========================= */
const G = {
  state: 'title', scene: null, sceneName: null, map: null, ents: [],
  player: { x: 120, y: 120, dir: 'up', anim: 0, moving: false },
  flags: {}, flowers: 0, cats: 0, bumps: 0,
  scripting: false, trans: false, fadeA: 0, fadeTarget: 0, fadeResolve: null,
  parts: [], bubbles: [], t: 0, lastPed: -9, lastBump: -9, screenOn: false, celebrate: false
};
const keys = { up:false, down:false, left:false, right:false };

/* ========================= paletas ========================= */

function drawPerson(cx, fy, dir, frame, pal){

  R(x + 1, fy - 1, 10, 2, 'rgba(0,0,0,.25)');
  const la = frame < 0 ? 4 : (frame ? 3 : 4), lb = frame < 0 ? 4 : (frame ? 4 : 3);
  const parts = [];
  parts.push([3, 12, 2, la, pal.pants], [7, 12, 2, lb, pal.pants]);
  if (pal.long) parts.push(pal.wavy ? [0, 2 + oy, 12, dir === 'up' ? 9 : 8, pal.hair] : [1, 2 + oy, 10, dir === 'up' ? 10 : 9, pal.hair]);
  parts.push([2, 8 + oy, 8, 5, pal.shirt]);
  if (!side) parts.push([1, 9 + oy, 1, 3, pal.skin], [10, 9 + oy, 1, 3, pal.skin]);
  parts.push([2, 1 + oy, 8, 7, pal.skin]);
  if (dir === 'up') parts.push([2, 0 + oy, 8, 7, pal.hair]);
  else parts.push([2, 0 + oy, 8, pal.bangs ? 4 : 3, pal.hair]);
  for (const p of parts) P(p[0] - 1, p[1] - 1, p[2] + 2, p[3] + 2, OUT);
  for (const p of parts) P(p[0], p[1], p[2], p[3], p[4]);
  if (pal.wavy){ P(0, 10 + oy, 1, 1, OUT); P(11, 10 + oy, 1, 1, OUT); P(0, 11 + oy, 2, 1, pal.hair); P(10, 11 + oy, 2, 1, pal.hair); }
  if (pal.messy){ P(5, -2 + oy, 1, 2, pal.hair); P(7, -2 + oy, 2, 1, pal.hair); P(3, -1 + oy, 1, 1, pal.hair); }
  if (pal.hairHi) P(dir === 'up' ? 4 : 3, 1 + oy, 3, 1, pal.hairHi);
  const g = pal.glasses;
  if (dir === 'down'){
    P(2, 3 + oy, 1, 2, pal.hair); P(9, 3 + oy, 1, 2, pal.hair);
    if (pal.bangs){ P(4, 4 + oy, 1, 1, pal.hair); P(6, 4 + oy, 1, 1, pal.hair); }
    P(4, 5 + oy, 1, 1, OUT); P(7, 5 + oy, 1, 1, OUT);
    if (g){ P(3, 4 + oy, 3, 1, g); P(6, 4 + oy, 3, 1, g); P(3, 5 + oy, 1, 1, g); P(5, 5 + oy, 2, 1, g); P(8, 5 + oy, 1, 1, g); P(3, 6 + oy, 3, 1, g); P(6, 6 + oy, 3, 1, g); }
    else {
      P(4, 4 + oy, 1, 1, OUT); P(7, 4 + oy, 1, 1, OUT);
      if (pal.lips){ P(3, 4 + oy, 1, 1, OUT); P(8, 4 + oy, 1, 1, OUT); }
      P(3, 6 + oy, 1, 1, '#f08a9a'); P(8, 6 + oy, 1, 1, '#f08a9a');
    }
    if (pal.lips) P(5, 7 + oy, 2, 1, pal.lips);
    if (pal.clip) P(8, 0 + oy, 2, 2, pal.clip);
    if (pal.phones){ P(1, -1 + oy, 10, 1, '#121016'); P(0, 3 + oy, 2, 4, '#121016'); P(10, 3 + oy, 2, 4, '#121016'); P(1, 4 + oy, 1, 2, '#d0283c'); P(10, 4 + oy, 1, 2, '#d0283c'); }
  } else if (side){
    P(2, 3 + oy, 3, 3, pal.hair);
    P(8, 5 + oy, 1, 1, OUT);
    if (g){ P(7, 4 + oy, 3, 1, g); P(7, 6 + oy, 3, 1, g); P(9, 5 + oy, 1, 1, g); P(5, 4 + oy, 2, 1, g); }
    else P(8, 6 + oy, 1, 1, '#f08a9a');
    if (pal.lips) P(9, 7 + oy, 1, 1, pal.lips);
    P(6, 9 + oy, 2, 3, pal.skin);
    if (pal.clip) P(3, 0 + oy, 2, 2, pal.clip);
    if (pal.phones){ P(3, -1 + oy, 4, 1, '#121016'); P(4, 3 + oy, 3, 4, '#121016'); P(5, 4 + oy, 1, 2, '#d0283c'); }
  } else {
    if (pal.clip) P(3, 1 + oy, 2, 2, pal.clip);
    if (pal.phones){ P(1, -1 + oy, 10, 1, '#121016'); P(0, 3 + oy, 2, 4, '#121016'); P(10, 3 + oy, 2, 4, '#121016'); }
  }
  if (pal.hat){ P(0, -1 + oy, 12, 2, pal.hat); P(3, -4 + oy, 6, 3, pal.hat); P(5, -7 + oy, 3, 3, pal.hat); P(3, -2 + oy, 6, 1, '#ff8a1f'); }

function grass(X, Y, tx, ty){
  R(X, Y, 16, 16, '#5fa64d');
  for (let i = 0; i < 5; i++) R(X + (hash(tx, ty, i) * 14 | 0), Y + (hash(tx, ty, i + 9) * 14 | 0), 1, 2, '#4a8a3d');

function floorTile(X, Y, tx, ty, s){

    R(X, Y, 16, 16, '#4a4a52'); R(X + (hash(tx, ty) * 14 | 0), Y + (hash(tx, ty, 3) * 14 | 0), 1, 1, '#5a5a62');
    if ((ty === 4 || ty === 7) && tx % 2 === 1) R(X, Y, 1, 16, '#c8c8d0');

function wrapText(text, maxW){
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words){ const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}

      ctx.fillStyle = '#b0283c'; ctx.textAlign = 'center';
      lines.forEach((l, k) => ctx.fillText(l, 120, y + 6 + k * 8));
    } else {
      const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 8;
      const x = m.from === 'me' ? 153 - w : 87;
      R(x, y, w, h, m.from === 'me' ? '#9b6ad8' : '#ddd5e6');
      ctx.fillStyle = m.from === 'me' ? '#fff' : OUT; ctx.textAlign = 'left';
      lines.forEach((l, k) => ctx.fillText(l, x + 4, y + 6 + k * 8));
    }
    y -= 4;
  }
}

/* ========================= colisão ========================= */
function tileAt(tx, ty){ if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return null; return G.map[ty][tx]; }
function tileAtPx(x, y){ return tileAt(Math.floor(x / TILE), Math.floor(y / TILE)); }
function exitAtTile(tx, ty){
  const cx = tx * TILE + 8, cy = ty * TILE + 8;
  return G.ents.find(e => e.kind === 'exit' && cx >= e.x && cx < e.x + e.w && cy >= e.y && cy < e.y + e.h);
}
function collide(nx, ny){
  const l = nx - 5, r = nx + 4, t = ny - 6, b = ny - 1;
  for (let ty = Math.floor(t / TILE); ty <= Math.floor(b / TILE); ty++)
    for (let tx = Math.floor(l / TILE); tx <= Math.floor(r / TILE); tx++){
      const ex = exitAtTile(tx, ty);
      if (ex){ if (!ex.open()) return { exit: ex }; continue; }
      const ch = tileAt(tx, ty);
      if (ch === null || SOLID.has(ch)) return { tile: true };
    }
  for (const e of G.ents){
    if ((e.kind === 'npc' && !e.walker) || e.kind === 'cat'){
      if (r > e.x - 6 && l < e.x + 6 && b > e.y - 6 && t < e.y) return { ent: e };
    }
  }
  return null;
}
function tryMove(dx, dy){
  const p = G.player;
  for (const [ax, ay] of [[dx, 0], [0, dy]]){
    if (!ax && !ay) continue;
    const hit = collide(p.x + ax, p.y + ay);
    if (!hit){ p.x += ax; p.y += ay; continue; }
    if (hit.exit && G.t - G.lastBump > 1.6){
      G.lastBump = G.t; const [msg, who] = hit.exit.locked(); sfx.bump(); run(() => say(msg, who));
      return;
    }
    // ajuda a passar por portas e vãos: desliza para o lado livre
    for (let k = 1; k <= 7; k++){
      let done = false;
      for (const s of [k, -k]){
        const ox = ay ? s : 0, oy = ax ? s : 0;
        if (!collide(p.x + ox, p.y + oy) && !collide(p.x + ox + ax, p.y + oy + ay)){
          p.x += Math.sign(ox); p.y += Math.sign(oy); done = true; break;
        }
      }
      if (done) break;
    }
  }
}

function frontEntity(){
  const p = G.player, d = DIRS[p.dir], cx = p.x, cy = p.y - 6;
  const p1 = { x: cx + d[0] * 12, y: cy + d[1] * 12 }, p2 = { x: cx + d[0] * 28, y: cy + d[1] * 28 };
  const hitE = pt => G.ents.find(e => (e.kind === 'npc' || e.kind === 'cat' || e.kind === 'fly') &&
    pt.x >= e.x - 8 && pt.x <= e.x + 8 && pt.y >= e.y - (e.kind === 'fly' ? 30 : 16) && pt.y <= e.y + 3);
  let e = hitE(p1);
  if (!e && tileAtPx(p1.x, p1.y) === 'C') e = hitE(p2);
  return { e, tile: tileAtPx(p1.x, p1.y) };
}
function interact(){
  const { e, tile } = frontEntity();
  if (e){
    if (e.kind === 'npc') e.dir = OPP[G.player.dir];
    if (e.kind === 'cat') return run(() => catTalk(e));
    return run(() => e.talk(e));
  }
  if (G.sceneName === 'parque'){
    if (tile === 'b' && !G.flags.parque) return run(sitBench);
    if (tile === 'B') return run(drinkWater);
  }
  const msg = G.scene.tileTalk && G.scene.tileTalk[tile];
  if (msg) run(() => say(msg));
}
function pressA(){
  initAudio();
  if (G.qte){ G.qtePressed = true; return; }
  if (G.state === 'title') return startGame();
  if (G.state !== 'play') return;
  if (D.active) return advance();
  if (G.scripting || G.trans) return;
  if (G.boss && G.boss.phase === 'fight') return bossShoot();
  interact();
}
function pressB(){
  initAudio();
  if (G.state !== 'play' || D.active || G.scripting || G.trans) return;
  if (G.boss && G.boss.phase === 'fight') return bossShoot();
  sfx.oxi(); bubble(G.player, 'Oxi!');
}

/* ========================= update ========================= */
const WALKER_LINES = ['De novo, moça?!', 'Ai! Olha por onde anda!', 'Eu só tava passando!', 'Essa moça é perigosa!', 'Socorro!'];
function update(dt){
  G.t += dt;
  if (G.fadeResolve){
    const dir = G.fadeTarget > G.fadeA ? 1 : -1;
    G.fadeA += dir * dt * 3.5;
    if ((dir > 0 && G.fadeA >= G.fadeTarget) || (dir < 0 && G.fadeA <= G.fadeTarget)){ G.fadeA = G.fadeTarget; const r = G.fadeResolve; G.fadeResolve = null; r(); }
  }
  const p = G.player;
  const frozen = G.state !== 'play' || D.active || G.scripting || G.trans || (G.scene && G.scene.custom);
  p.moving = false;
  if (!frozen){
    let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (dx || dy){
      p.dir = dx ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      const sp = 62 * dt * (dx && dy ? 0.707 : 1);
      const steps = Math.ceil(sp);
      for (let i = 0; i < steps; i++) tryMove(dx * sp / steps, dy * sp / steps);
      p.moving = true; p.anim += dt * 8;
    }
    // portas abertas
    for (const e of G.ents) if (e.kind === 'exit' && e.open() && p.x >= e.x && p.x < e.x + e.w && p.y - 3 >= e.y && p.y - 3 < e.y + e.h) { go(e.to); break; }
    // flores
    for (const e of G.ents) if (e.kind === 'flower' && !e.got && Math.abs(e.x - p.x) < 9 && Math.abs(e.y - (p.y - 4)) < 9){
      e.got = true; G.flowers++; sfx.pickup(); bubble(p, `+1 (${G.flowers}/5)`); updateHUD();
      if (G.flowers >= 5 && !G.flags.flores) run(parkDone);
    }
    if (G.sceneName === 'parque' && G.thirstAt && G.t > G.thirstAt && !G.flags.agua){
      G.thirstAt = G.t + 18; G.flags.sede = true; sfx.oxi(); bubble(p, 'Que sede, véi...'); updateHUD();
    }
    for (const e of G.ents) if (e.kind === 'spot' && G.flags.flores && !G.flags.ipes && !G.scripting && Math.abs(e.x - p.x) < 7 && Math.abs(e.y - p.y) < 7) run(takePhoto);
  }
  for (const e of G.ents){
    if (e.kind === 'fly'){ e.x = e.bx + Math.sin(G.t * 0.9) * 22; e.y = e.by + Math.sin(G.t * 1.7) * 6; }
    if (e.walker && !frozen){
      e.x += e.vx * dt; e.anim += dt * 7;
      if (e.x < e.a){ e.x = e.a; e.vx = Math.abs(e.vx); } if (e.x > e.b){ e.x = e.b; e.vx = -Math.abs(e.vx); }
      e.dir = e.vx > 0 ? 'right' : 'left';
      if (G.state === 'play' && Math.abs(e.x - p.x) < 9 && Math.abs(e.y - p.y) < 7 && G.t - G.lastPed > 2){
        G.lastPed = G.t; G.bumps++; sfx.bump(); e.vx = -e.vx; e.x += Math.sign(e.vx) * 4;
        const ls = e.lines || WALKER_LINES;
        bubble(p, 'Oxi!'); bubble(e, ls[(G.bumps - 1) % ls.length]);
      }
    }
  }
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.5);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  if (G.boss){ if (!frozen) updateBoss(dt); updateLizard(dt); }
  if (G.sceneName === 'carro' && G.drive){
    const d = G.drive;
    if (d.braking) d.speed = Math.max(0, d.speed - 260 * dt);
    d.x += d.speed * dt;
    if (d.ped){
      d.pedX -= d.speed * dt;
      const target = d.pedWalk ? 175 : 110;
      d.walking = d.pedY < target;
      if (d.walking) d.pedY = Math.min(target, d.pedY + 34 * dt);
    }
    d.pedObj.x = d.pedX; d.pedObj.y = d.pedY;
  }
  // partículas
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if ((G.scene && G.scene.petals) || G.celebrate){
    const rate = (G.celebrate ? 0.5 : 0.22) * (reduce ? 0.35 : 1);
    if (Math.random() < rate) G.parts.push({ k:'petal', x: Math.random() * (W + 40), y: -4, vx: -8 - Math.random() * 10, vy: 14 + Math.random() * 14, ph: Math.random() * 6, c: Math.random() < 0.5 ? '#f5c518' : '#ffd84a' });
    if (G.celebrate && Math.random() < 0.25 * (reduce ? 0.35 : 1)) G.parts.push({ k:'heart', x: 8 + Math.random() * (W - 16), y: H + 6, vx: 0, vy: -18 - Math.random() * 14, ph: Math.random() * 6, c: Math.random() < 0.5 ? '#ff7a9c' : '#ff4f7b' });
  }
  for (const q of G.parts){ if (q.g) q.vy += 160 * dt; q.x += q.vx * dt + Math.sin(q.ph + G.t * 3) * 0.25; q.y += q.vy * dt; }
  G.parts = G.parts.filter(q => q.y < H + 8 && q.y > -12 && q.x > -12);
  for (const b of G.bubbles) b.t -= dt;
  G.bubbles = G.bubbles.filter(b => b.t > 0);
}

/* ========================= render ========================= */
function render(){
  ctx.clearRect(0, 0, W, H);
  if (!G.scene) return;
  if (G.scene.custom){
    G.scene.drawOver();
    drawBubbles();
    if (G.fadeA > 0) R(0, 0, W, H, `rgba(20,10,28,${Math.min(1, G.fadeA)})`);
    return;
  }
  const shaking = G.shake > 0;
  if (shaking){ ctx.save(); ctx.translate(Math.round((Math.random() - 0.5) * 5 * G.shake), Math.round((Math.random() - 0.5) * 5 * G.shake)); }
  drawTiles();
  G.scene.drawOver();
  for (const e of G.ents){
    if (e.kind === 'exit'){
      if (e.door){
        R(e.x + 2, e.y + 1, 12, 15, '#3a2216'); R(e.x + 3, e.y + 2, 10, 14, e.open() ? '#120a14' : '#8a5a30');
        if (!e.open()) R(e.x + 10, e.y + 9, 2, 2, '#f5c518'); else drawArrow(e.x + 8, e.y - 9, 'down');
      } else if (e.open() && (!e.arrow || e.arrow())) drawArrow(e.x + 9, e.y + e.h / 2, 'right');
    }
    if (e.kind === 'flower' && !e.got) drawFlowerPickup(e.x, e.y);
  }
  const list = G.ents.filter(e => e.kind === 'npc' || e.kind === 'cat' || e.kind === 'fly');
  if (G.state !== 'title') list.push({ kind:'player', x: G.player.x, y: G.player.y });
  list.sort((a, b) => a.y - b.y);
  for (const e of list){
    if (e.kind === 'player' && G.boss && G.boss.inv > 0 && Math.floor(G.t * 15) % 2) continue;
    if (e.kind === 'player') drawPerson(G.player.x, G.player.y, G.player.dir, G.player.moving ? Math.floor(G.player.anim) % 2 : -1, PAL.vitoria);
    else if (e.kind === 'npc'){
      drawPerson(e.x, e.y, e.dir, e.walker ? Math.floor(e.anim) % 2 : -1, e.pal);
      if (e.diamond) drawDiamond(e.x, e.y - 27);
      if (e.quest && e.quest() && G.state === 'play') drawBang(e.x, e.y - 30);
    }
    else if (e.kind === 'cat') drawCat(e.x, e.y, e.col, e.eye);
    else if (e.kind === 'fly') drawButterfly(e.x, e.y - 18);
  }
  drawCanopies();
  drawBoss();
  for (const q of G.parts){
    if (q.k === 'heart') drawHeart(q.x, q.y, q.c);
    else { R(q.x, q.y, 2, 2, q.c); if (Math.sin(q.ph + G.t * 4) > 0) R(q.x + 2, q.y + 1, 1, 1, q.c); }
  }
  // indicador de "A" na frente
  if (G.state === 'play' && !D.active && !G.scripting && !G.trans){
    const { e } = frontEntity();
    if (e){ const bx = e.x, by = e.y - (e.kind === 'fly' ? 34 : e.kind === 'cat' ? 18 : 26); R(bx - 4, by - 4, 9, 9, OUT); R(bx - 3, by - 3, 7, 7, '#ff7a9c');
      ctx.fillStyle = OUT; ctx.font = "bold 7px 'Pixelify Sans', monospace"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('A', bx + 0.5, by + 0.5); }
  }
  drawBubbles();
  if (G.polaroid){
    ctx.save(); ctx.translate(120, 52); ctx.rotate(-0.05);
    R(-53, -38, 106, 82, OUT); R(-52, -37, 104, 80, '#fff8ea'); ctx.drawImage(G.polaroid, -48, -33);
    ctx.restore();
  }
  if (shaking) ctx.restore();
  if (G.flash > 0){ R(0, 0, W, H, `rgba(255,255,255,${G.flash})`); }
  if (G.fadeA > 0) R(0, 0, W, H, `rgba(20,10,28,${Math.min(1, G.fadeA)})`);
}
function drawBubbles(){
  ctx.font = "8px 'Pixelify Sans', monospace"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const b of G.bubbles){
    const src = b.who, bx = Math.round(src.x), by = Math.round(src.y) - (src.kind === 'cat' ? 18 : 26) - (1.6 - b.t) * 4;
    const w = Math.ceil(ctx.measureText(b.text).width) + 8;
    const x0 = Math.max(1, Math.min(W - w - 1, bx - w / 2));
    R(x0 - 1, by - 6, w + 2, 12, OUT); R(x0, by - 5, w, 10, '#fff8ea'); R(bx - 1, by + 5, 3, 2, '#fff8ea');
    ctx.fillStyle = OUT; ctx.fillText(b.text, x0 + w / 2, by + 0.5);
  }
}

/* ========================= loop ========================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}

/* ========================= entrada ========================= */
const KEYMAP = { ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right' };
addEventListener('keydown', e => {
  const d = KEYMAP[e.code];
  if (d){
    e.preventDefault();
    if (!keys[d] && D.active){ if (d === 'up' || d === 'left') moveSel(-1); if (d === 'down' || d === 'right') moveSel(1); }
    keys[d] = true; return;
  }
  if (['KeyZ', 'Space', 'Enter', 'KeyJ'].includes(e.code)){ e.preventDefault(); if (!e.repeat) pressA(); }
  if (['KeyX', 'KeyK'].includes(e.code)){ e.preventDefault(); if (!e.repeat) pressB(); }
});
addEventListener('keyup', e => { const d = KEYMAP[e.code]; if (d) keys[d] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('.pad').forEach(b => {
  const d = b.dataset.dir;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio();
    if (D.active){ if (d === 'up') moveSel(-1); if (d === 'down') moveSel(1); }
    keys[d] = true; try { b.setPointerCapture(e.pointerId); } catch (_) {}
  });
  const up = () => { keys[d] = false; };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
});
$('btnA').addEventListener('pointerdown', e => { e.preventDefault(); pressA(); });
$('btnB').addEventListener('pointerdown', e => { e.preventDefault(); pressB(); });
$('startBtn').addEventListener('click', e => { e.stopPropagation(); pressA(); });
$('title').addEventListener('click', () => pressA());
$('againBtn').addEventListener('click', () => startGame());
$('mute').addEventListener('click', () => {
  muted = !muted; $('mute').textContent = muted ? 'Som: desligado' : 'Som: ligado';
  if (master) master.gain.value = muted ? 0 : 0.5;
});

/* tela de título: o parque com as flores caindo ao fundo */
loadScene('ipes');
$('place').textContent = 'Sorocaba'; $('obj').textContent = 'Aperte começar';
requestAnimationFrame(loop);
</script>
